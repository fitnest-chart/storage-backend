replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/storage-service
  tag: "development-9eb2721"
  pullPolicy: Always
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 9090
istio:
  enabled: true
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/user-service"
      - "cluster.local/ns/fitnest-dev/sa/catalog-service"
env:
  STORAGE_EMAIL: "fitnestazerbaijan@gmail.com"
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  STORAGE_PASSWORD: "Fitnest123!"
  STORAGE_PORT: "9090"
  REDIS_HOST: "redis.fitnest-dev.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  LOG_LEVEL: "info"
  JAVA_TOOL_OPTIONS: >
    -Xms256m
    -Xmx768m
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+ParallelRefProcEnabled
    -XX:MaxMetaspaceSize=128m
    -XX:+AlwaysPreTouch
    -Xss512k
    -XX:+ExitOnOutOfMemoryError"
resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    cpu: 1000m
    memory: 1536Mi
