# values.yaml for storage-backend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/storage-backend
  tag: "development-5b1485a"
  pullPolicy: Always
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 9090
networkPolicy:
  enabled: true
  allowedServices:
    - user-backend
    - catalog-backend
    - notifications-backend
    - fitness-plan-backend
    - payment-backend
    - support-backend
    # gateway-backend is already hardcoded in the policy template
env:
  STORAGE_EMAIL: "fitnestazerbaijan@gmail.com"
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  STORAGE_PASSWORD: "Fitnest123!"
  STORAGE_PORT: "9090"
  REDIS_HOST: "10.0.0.4"
  REDIS_PORT: "6380"
  REDIS_PASSWORD: "ChangeMeDevRedis!"
  LOG_LEVEL: "info"
  GRPC_USE_TLS: "false"
  GRPC_TLS_SERVER_CERT: "/etc/certs/tls.crt"
  GRPC_TLS_SERVER_KEY: "/etc/certs/tls.key"
  GRPC_TLS_CA_CERT: "/etc/certs/ca.crt"
  GRPC_REQUIRE_CLIENT_CERT: "false"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

resources:
  requests:
    cpu: 11m
    memory: 168Mi
  limits:
    cpu: 1000m
    memory: 258Mi
