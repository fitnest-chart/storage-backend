image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: Always
  repository: ghcr.io/fitnest-code/storage-backend
  tag: production-9864c85
networkPolicy:
  allowedServices:
    - user-backend
    - catalog-backend
    - notifications-backend
    - fitness-plan-backend
    - payment-backend
    - support-backend
  enabled: true
replicaCount: 1
service:
  port: 8080
  grpcPort: 9090
  type: ClusterIP
vaultEnv: production
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi
